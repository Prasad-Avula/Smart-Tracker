name: Build & Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # These must be configured as GitHub Secrets (Settings → Secrets → Actions)
  VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
  VITE_FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
  VITE_RECAPTCHA_V3_SITE_KEY: ${{ secrets.RECAPTCHA_V3_SITE_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify production Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          required_vars=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
          )

          for variable_name in "${required_vars[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing ${variable_name} GitHub secret"
              exit 1
            fi
          done

          if [[ "${VITE_FIREBASE_PROJECT_ID}" != "smart-tracker-8c48c" ]]; then
            echo "::error::The production Firebase project ID does not match the deployed project"
            exit 1
          fi

          if grep -R -E -q 'your-api-key|your-project-id|your-project\.firebaseapp\.com' dist/assets; then
            echo "::error::The production bundle contains placeholder Firebase configuration"
            exit 1
          fi

      - name: Authenticate Firebase CLI
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Deploy Firestore rules and indexes
        run: npx firebase-tools deploy --project smart-tracker-8c48c --only firestore:rules,firestore:indexes

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: smart-tracker-8c48c
          channelId: live
          entryPoint: './dist'
